name: Refresh data & deploy

# One workflow does the refresh AND the deploy, deliberately.
#
# Commits pushed with GITHUB_TOKEN do not trigger further workflow runs. Split
# across two workflows (refresh -> commit -> "on: push" deploy), the deploy would
# simply never fire and the site would quietly go stale. Keeping both steps in a
# single job also means the same run that fetched the data is the one that
# publishes it.

on:
  push:
    branches:
      - main
      - claude/us-economic-dashboard-0692xt
  schedule:
    # 13:10 UTC on weekdays — after the 08:30 ET window when most US releases land.
    - cron: '10 13 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: 'Deploy the committed snapshot without re-fetching FRED'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish so a half-published
# site is not left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh data from FRED
        if: ${{ inputs.skip_refresh != true }}
        run: npm run refresh:data

      - name: Commit refreshed snapshot
        if: ${{ inputs.skip_refresh != true && github.event_name != 'pull_request' }}
        run: |
          if [[ -z "$(git status --porcelain public/data)" ]]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh FRED snapshot ($(date -u +%Y-%m-%d))"
          # Rebase in case a human pushed while this run was in flight.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build
        run: npm run build

      # Force the Pages source to "GitHub Actions".
      #
      # If Pages is already enabled in branch mode, GitHub runs its own
      # "pages build and deployment" on every push, which serves the raw
      # repository root — the unbuilt index.html pointing at /src/main.tsx,
      # with every data/*.json 404ing — and races this workflow's artifact.
      # `configure-pages` alone does not fix that: its `enablement` input only
      # creates Pages when absent, it does not change the build type of a site
      # that already exists. Setting build_type explicitly does.
      - name: Force Pages to deploy from Actions, not the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $code"
          if [ "$code" = "404" ]; then
            # Pages not enabled yet; create it directly in workflow mode.
            code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}')
            echo "POST /pages -> $code"
          fi
          # 204/201 are success; anything else is worth seeing in the log but
          # should not fail the run, since configure-pages may still succeed.
          cat /tmp/pages.json 2>/dev/null || true

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
